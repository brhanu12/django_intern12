{% extends "blog/base.html" %}

{% block title %}
Edit Comment
{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto bg-white shadow-lg rounded-lg p-8 mt-10">

    <h1 class="text-3xl font-bold mb-6">

        Edit Comment

    </h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700"
        >

            Save Changes

        </button>

    </form>

</div>

{% endblock %}
