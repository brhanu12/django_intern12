{% extends "blog/base.html" %}

{% block title %}
Delete Comment
{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto mt-10 bg-white shadow-lg rounded-xl p-8">

    <h1 class="text-3xl font-bold text-red-600 mb-6">

        Delete Comment

    </h1>

    <p class="mb-6 text-gray-700">

        Are you sure you want to delete this comment?

    </p>

    <div class="bg-gray-100 border rounded-lg p-4 mb-6">

        <strong>{{ comment.author.username }}</strong>

        <p class="mt-2">

            {{ comment.content }}

        </p>

    </div>

    <form method="POST">

        {% csrf_token %}

        <button
            type="submit"
            class="bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700"
        >

            Yes, Delete

        </button>

        <a
            href="{% url 'blog_detail' comment.blog.pk %}"
            class="ml-3 bg-gray-500 text-white px-5 py-2 rounded-lg hover:bg-gray-600"
        >

            Cancel

        </a>

    </form>

</div>

{% endblock %}
