{% extends 'blog/base.html' %}

{% block title %}
Create Blog
{% endblock %}

{% block content %}

<h1 class="text-3xl font-bold mb-6">
    Create Blog
</h1>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="title"
        placeholder="Blog Title"
        class="w-full border p-2 mb-4"
    >

    <textarea
        name="content"
        rows="6"
        class="w-full border p-2 mb-4"
    ></textarea>

    <button
        type="submit"
        class="bg-green-600 text-white px-4 py-2 rounded"
    >
        Save
    </button>

</form>

{% endblock %}
