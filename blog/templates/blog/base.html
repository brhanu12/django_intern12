<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <header class="bg-white  border-b border-gray-200">
        <div class="max-w-3xl flex justify-center mx-auto px-2 py-3">
            <a href="{% url 'blog_list' %}" class="text-2xl font-bold text-gray-900 hover:text-blue-600">My Blog</a>
        
        </div>
    {% if user.is_authenticated %}

<div class="flex justify-between items-center w-full">

    
    <span class="text-green-600 font-semibold pl-2">
        Welcome {{ user.username }}
    </span>


    <a href="{% url 'logout' %}"
       class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
        Logout
    </a>

</div>

{% else %}

<div class="flex justify-between gap-3 items-center">

     <a href="{% url 'register' %}"
       class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
        Register
    </a>

    <a href="{% url 'login' %}"
       class="bg-blue-600 text-white mr-3 pr-4 py-2 rounded-lg hover:bg-blue-700 ">
        Login
    </a>

   

</div>

{% endif %}
    </header>
    {% if messages %}

<div class="max-w-4xl mx-auto mt-4">

    {% for message in messages %}

        <div
            class="mb-3 p-4 rounded-lg
            {% if message.tags == 'success' %}
                bg-green-100 border border-green-400 text-green-700
            {% elif message.tags == 'error' %}
                bg-red-100 border border-red-400 text-red-700
            {% elif message.tags == 'warning' %}
                bg-yellow-100 border border-yellow-400 text-yellow-700
            {% else %}
                bg-blue-100 border border-blue-400 text-blue-700
            {% endif %}">

            {{ message }}

        </div>

    {% endfor %}

</div>

{% endif %}

    
    
    <div class="flex">
        <!-- sidebar -->
         <div class="bg-sky-500 w-1/4 min">this is sidebar </div>
         
        <main class="max-w-3xl mx-auto px-4 py-8">

            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
