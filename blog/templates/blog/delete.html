{% extends 'blog/base.html' %}

{% block title %}
Delete Blog
{% endblock %}

{% block content %}

<h1 class="text-3xl font-bold text-red-600 mb-6">
    Delete Blog
</h1>

<p class="mb-4">

    Are you sure you want to delete:

    <strong>{{ blog.title }}</strong> ?

</p>

<form method="POST">

    {% csrf_token %}

    <button
        type="submit"
        class="bg-red-600 text-white px-4 py-2 rounded"
    >
        Confirm Delete
    </button>

</form>

{% endblock %}
