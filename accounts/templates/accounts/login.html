{% extends "blog/base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto mt-10 bg-white shadow-lg rounded-xl p-8">

    <h1 class="text-3xl font-bold text-center mb-6">
        Login
    </h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700"
        >
            Login
        </button>

    </form>

</div>

{% endblock %}
