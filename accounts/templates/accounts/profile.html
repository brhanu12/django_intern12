{% extends "blog/base.html" %}

{% block content %}

<div class="max-w-2xl mx-auto mt-10 bg-white shadow-lg rounded-xl p-8">

    <h1 class="text-3xl font-bold mb-6">

        My Profile

    </h1>

    <p>

        Username:

        <strong>

            {{ profile.user.username }}

        </strong>

    </p>

    <p>

        Email:

        {{ profile.user.email }}

    </p>

    <p>

        Phone:

        {{ profile.phone }}

    </p>

    <p>

        Address:

        {{ profile.address }}

    </p>

    <p>

        Website:

        {{ profile.website }}

    </p>

    <p>

        Bio:

        {{ profile.bio }}

    </p>

</div>

{% endblock %}
